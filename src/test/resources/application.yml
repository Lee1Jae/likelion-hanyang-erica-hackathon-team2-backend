spring:
  datasource:
    url: jdbc:h2:mem:bloom;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

security:
  jwt:
    secret: test-secret-key-that-is-at-least-thirty-two-bytes-long
    access-ttl-seconds: 3600
    refresh-ttl-seconds: 1209600

app:
  cors:
    allowed-origins: http://localhost:*
